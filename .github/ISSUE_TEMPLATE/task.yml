name: Task
description: Tooling, CI, documentation or maintenance work that does not change behaviour.
labels: ["type:chore"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is missing today and why it matters.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checks that prove the task is complete.
    validations:
      required: true
