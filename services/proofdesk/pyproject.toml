[project]
name = "proofdesk"
version = "0.1.0"
description = "ProofDesk core: contracts, parsing and validation for invoices"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]  # S = bandit (security)

[tool.ruff.lint.isort]
known-first-party = ["proofdesk", "tests"]  # so import order is the same before and after a module exists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest uses plain assert

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=proofdesk --cov-branch --cov-fail-under=90 -m 'not live'"
markers = ["live: calls real AWS services, run only on purpose"]
